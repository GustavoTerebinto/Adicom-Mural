services:
  web:
    image: nginx:alpine
    volumes:
      - ./:/var/www
      - ./docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks: [laravel-dev]
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: [.env]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www
    networks: [laravel-dev]
    depends_on:
      postgres:
        condition: service_started

  workspace:
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    tty: true
    stdin_open: true
    env_file: [.env]
    volumes:
      - ./:/var/www
    networks: [laravel-dev]

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks: [laravel-dev]

  redis:
    image: redis:alpine
    networks: [laravel-dev]

networks:
  laravel-dev:

volumes:
  postgres-data-dev: