services:
  web:
    build:
      context: .
      dockerfile: ./docker/production/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - laravel-storage-prod:/var/www/storage:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks: [laravel-prod]
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    volumes:
      - laravel-storage-prod:/var/www/storage
    env_file: [.env]
    networks: [laravel-prod]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    networks: [laravel-prod]
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks: [laravel-prod]

networks:
  laravel-prod:

volumes:
  postgres-data-prod:
  laravel-storage-prod: